name: Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (OpenMP for LightGBM)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Install Core Production Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn lightgbm streamlit altair

      - name: Generate Synthetic Test Batch
        run: |
          python generate_feed.py

      - name: Verify LightGBM Model Loading
        run: |
          python -c "from src.inference_pipeline import FraudInferencePipeline; p = FraudInferencePipeline(); print('MODEL LOAD OK')"

      - name: Run Synthetic Inference Parity & Sanity Check
        run: |
          python -c "
          import pandas as pd
          from src.inference_pipeline import FraudInferencePipeline
          
          df = pd.read_csv('test_batch_feed.csv').head(50)
          pipeline = FraudInferencePipeline()
          preds = pipeline.predict_step(df)
          assert len(preds) == 50, f'Expected 50 predictions, got {len(preds)}'
          print(f'CI SANITY PASS: Successfully scored {len(preds)} transactions')
          "