name: Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Model Loading
        run: |
          python -c "from src.inference_pipeline import FraudInferencePipeline; p = FraudInferencePipeline(); print('MODEL LOAD OK')"

      - name: Run Schema & Boundary Validations
        run: |
          python src/test_inference_validation.py
          python src/test_inference_predictions.py